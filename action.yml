name: AgentInjectionBench
description: Score agent-injection predictions and fail CI when security thresholds regress
inputs:
  predictions:
    description: Path to a JSONL file containing id and prediction fields
    required: true
  name:
    description: Display name for the evaluated agent or guardrail
    required: false
    default: GitHub Actions run
  max-asr:
    description: Maximum allowed attack-success rate, from 0 to 1
    required: false
  max-fpr:
    description: Maximum allowed false-positive rate, from 0 to 1
    required: false
  min-balanced-accuracy:
    description: Minimum required balanced accuracy, from 0 to 1
    required: false
runs:
  using: composite
  steps:
    - name: Install AgentInjectionBench
      shell: bash
      env:
        AIB_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install "$AIB_ACTION_PATH"
    - name: Score predictions
      shell: bash
      env:
        AIB_PREDICTIONS: ${{ inputs.predictions }}
        AIB_NAME: ${{ inputs.name }}
        AIB_MAX_ASR: ${{ inputs.max-asr }}
        AIB_MAX_FPR: ${{ inputs.max-fpr }}
        AIB_MIN_BA: ${{ inputs.min-balanced-accuracy }}
      run: |
        args=(--predictions "$AIB_PREDICTIONS" --name "$AIB_NAME")
        if [[ -n "$AIB_MAX_ASR" ]]; then args+=(--max-asr "$AIB_MAX_ASR"); fi
        if [[ -n "$AIB_MAX_FPR" ]]; then args+=(--max-fpr "$AIB_MAX_FPR"); fi
        if [[ -n "$AIB_MIN_BA" ]]; then args+=(--min-balanced-accuracy "$AIB_MIN_BA"); fi
        aib-score "${args[@]}"
