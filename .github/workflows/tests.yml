name: Tests

on:
  push:
    branches: [main, "auto/**"]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install pytest pyyaml jsonschema

      - name: Run dataset-integrity tests
        run: python -m pytest -q
