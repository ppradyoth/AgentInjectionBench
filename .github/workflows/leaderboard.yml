name: Render leaderboard

on:
  push:
    paths:
      - "submissions/**"
      - "data/**"
      - "evaluation/**"
      - "LEADERBOARD.md"
  workflow_dispatch:

jobs:
  leaderboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python scripts/render_submissions.py
      - uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: refresh leaderboard"
          file_pattern: LEADERBOARD.md
