[project]
name = "agent-injection-bench"
version = "0.1.0"
description = "A benchmark for evaluating prompt injection attacks in agentic tool-use pipelines"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [{name = "Pradyoth", email = "pradyoth0@gmail.com"}]
keywords = ["prompt-injection", "red-teaming", "ai-safety", "benchmark", "agentic-ai", "tool-use"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.20.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
openai = ["openai>=1.50.0"]
space = [
    "gradio>=5.0.0",
    "plotly>=5.18.0",
    "pandas>=2.1.0",
]
dev = [
    "ruff>=0.5.0",
    "pytest>=8.0.0",
]
all = ["agent-injection-bench[anthropic,openai,space,dev]"]

[project.scripts]
aib-generate = "generation.generate:main"
aib-curate = "generation.curate:main"
aib-stats = "generation.stats:main"
aib-score = "evaluation.score:main"
aib-leaderboard = "evaluation.leaderboard:main"
aib-run = "runtime.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The code lives in top-level packages rather than a single src/ package
# matching the distribution name, so list them explicitly for hatchling.
packages = ["generation", "evaluation", "runtime"]
force-include = {"data" = "data"}

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
